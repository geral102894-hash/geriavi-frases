/* Mesa de trabajo: el lote ocupa el centro; quien edita ve la imagen final, nunca una aproximación. */
:root{--bg:#FBF3F6;--fg:#34101A;--mute:#7A5A63;--line:#E9D5DD;--panel:#FFFFFF;--accent:#4F0F1B;--on-accent:#FFD7E7;--soft:#FFD7E7;--display:"Gloock",Georgia,serif;--body:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C0B10;--fg:#FBE9EF;--mute:#BFA1AA;--line:#46232D;--panel:#29131A;--accent:#FFD7E7;--on-accent:#4F0F1B;--soft:#4F0F1B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C0B10;--fg:#FBE9EF;--mute:#BFA1AA;--line:#46232D;--panel:#29131A;--accent:#FFD7E7;--on-accent:#4F0F1B;--soft:#4F0F1B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
.wrap{max-width:1180px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:24px}
h1{font:400 clamp(38px,6vw,60px)/1.02 var(--display);margin:0;text-wrap:balance}
header p{margin:8px 0 0;color:var(--mute);max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--mute)}
select,input,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button{font:800 15px var(--body);border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:11px 16px;cursor:pointer}
button.main{background:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #C8476E;outline-offset:2px}
.grow{flex:1 1 220px;min-width:0}
#status{min-height:22px;font-size:14px;color:var(--mute);margin:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left;font-weight:500;border-radius:12px}
.tile canvas{width:100%;height:auto;display:block;border-radius:10px;border:3px solid transparent}
.tile[aria-pressed="true"] canvas{border-color:#C8476E}
.tile small{color:var(--mute);font-size:13px}
#editor{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
#editor img{width:100%;height:auto;border-radius:10px;display:block}
.fields{display:flex;flex-direction:column;gap:12px;min-width:0}
.fields .row{display:flex;flex-wrap:wrap;gap:10px}
.hint{font-size:13px;color:var(--mute);margin:0}
h2{font:400 26px var(--display);margin:0}
@media (max-width:680px){#editor{grid-template-columns:1fr}}

<div class="wrap">
  <header>
    <h1>Fábrica de Frases</h1>
    <p>Arma el lote del día, corrige lo que quieras y guarda cada imagen en PNG, lista para Facebook en formato vertical 1080 × 1350.</p>
  </header>

  <section class="bar" aria-label="Crear lote">
    <label for="n" style="width:110px">Imágenes
      <select id="n"><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option></select>
    </label>
    <button class="main" id="mix">Mezclar lote</button>
    <label for="topic" class="grow">Tema para frases nuevas
      <input id="topic" placeholder="Ej.: amor propio, vivir lejos de mamá, piel sensible">
    </label>
    <button id="gen" hidden>Escribir 6 con Claude</button>
    <button id="zip">Guardar lote (ZIP)</button>
  </section>
  <p id="status" role="status"></p>

  <section id="editor" aria-label="Editar imagen">
    <div><img id="big" alt="Vista final de la imagen seleccionada"></div>
    <div class="fields">
      <h2>Imagen seleccionada</h2>
      <label for="fmt">Formato<select id="fmt"></select></label>
      <label for="txt">Frase (entre *asteriscos* va la parte resaltada)<textarea id="txt" rows="3"></textarea></label>
      <label for="its" id="itsL">Puntos u opciones, uno por línea<textarea id="its" rows="4"></textarea></label>
      <label for="cap">Pie de foto para Facebook<input id="cap"></label>
      <div class="row">
        <button class="main" id="png">Guardar PNG</button>
        <button id="copy">Copiar pie de foto</button>
        <button id="swap">Cambiar por otra frase</button>
      </div>
      <p class="hint">En el iPhone también puedes dejar presionada la imagen para guardarla en Fotos.</p>
    </div>
  </section>

  <section id="grid" aria-label="Lote del día"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>// Plantillas de imagen 1080x1350 (4:5). drawCard(canvas, item) sirve igual en el navegador y en Playwright.
// item = { f: formato, t: texto ( *así* se resalta ), items: [lista u opciones], c: pie de foto }
(function (root) {
  const W = 1080, H = 1350, M = 92;
  const C = { wine: '#4F0F1B', pink: '#FFD7E7', white: '#FFFFFF', rose: '#A82452', paper: '#FFF7FA' };
  const DISPLAY = 'Gloock', BODY = 'Figtree';
  const HANDLE = '@bygeriavi';

  const FORMATS = {
    verdad: 'La verdad', indirecta: 'Indirecta', latina: 'Latina en EE. UU.',
    lista: 'Lista corta', nota: 'Nota para mí', pregunta: 'Esto o aquello', dialogo: 'Conversación', permiso: 'Permiso'
  };

  function tokens(text) {
    const out = [];
    String(text).split('\n').forEach((line, li) => {
      if (li) out.push({ br: true });
      line.split(/(\*[^*]+\*)/).filter(Boolean).forEach(part => {
        const em = part[0] === '*' && part[part.length - 1] === '*' && part.length > 2;
        (em ? part.slice(1, -1) : part).split(/\s+/).filter(Boolean).forEach(w => out.push({ w, em }));
      });
    });
    return out;
  }

  function wrap(ctx, toks, maxW) {
    const lines = [[]]; let x = 0; const sp = ctx.measureText(' ').width;
    for (const t of toks) {
      if (t.br) { lines.push([]); x = 0; continue; }
      const w = ctx.measureText(t.w).width;
      if (x > 0 && x + w > maxW) { lines.push([]); x = 0; }
      lines[lines.length - 1].push({ ...t, width: w, x });
      x += w + sp;
    }
    return lines;
  }

  // Busca el tamaño mayor que cabe en la caja y nunca parte una palabra.
  function fit(ctx, text, box, o) {
    const toks = tokens(text);
    for (let s = o.max; s >= o.min; s -= 2) {
      ctx.font = `${o.weight || 400} ${s}px "${o.font}"`;
      const lines = wrap(ctx, toks, box.w);
      const lh = s * (o.lh || 1.12);
      const widest = Math.max(...toks.filter(t => t.w).map(t => ctx.measureText(t.w).width));
      if (lines.length * lh <= box.h && widest <= box.w) return { s, lines, lh };
    }
    ctx.font = `${o.weight || 400} ${o.min}px "${o.font}"`;
    return { s: o.min, lines: wrap(ctx, toks, box.w), lh: o.min * (o.lh || 1.12) };
  }

  function text(ctx, str, box, o) {
    const r = fit(ctx, str, box, o);
    const total = r.lines.length * r.lh;
    let y = box.y + (o.valign === 'top' ? 0 : (box.h - total) / 2) + r.s * 0.86;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.font = `${o.weight || 400} ${r.s}px "${o.font}"`;
    for (const line of r.lines) {
      const lw = line.length ? line[line.length - 1].x + line[line.length - 1].width : 0;
      const ox = o.align === 'center' ? box.x + (box.w - lw) / 2 : box.x;
      for (const t of line) {
        ctx.fillStyle = t.em ? (o.em || o.color) : o.color;
        ctx.fillText(t.w, ox + t.x, y);
      }
      y += r.lh;
    }
    return { bottom: box.y + (o.valign === 'top' ? total : (box.h + total) / 2), size: r.s };
  }

  function label(ctx, s, x, y, color) {
    ctx.font = `800 30px "${BODY}"`; ctx.fillStyle = color;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    ctx.fillText(s.toUpperCase(), x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function foot(ctx, color) {
    ctx.font = `800 34px "${BODY}"`; ctx.fillStyle = color;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(HANDLE, M, H - 76);
  }

  function bg(ctx, c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  const T = {
    // Vino a sangre, tipografía enorme: el formato que más se lee en miniatura.
    verdad(ctx, it) {
      bg(ctx, C.wine);
      label(ctx, FORMATS.verdad, M, 130, C.pink);
      text(ctx, it.t, { x: M, y: 180, w: W - M * 2, h: 960 }, { font: DISPLAY, max: 138, min: 70, color: C.pink, em: C.white, lh: 1.08 });
      foot(ctx, C.pink);
    },
    // Rosa con una comilla gigante detrás.
    indirecta(ctx, it) {
      bg(ctx, C.pink);
      ctx.font = `520px "${DISPLAY}"`; ctx.fillStyle = 'rgba(79,15,27,.09)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('“', W - 330, 480);
      label(ctx, FORMATS.indirecta, M, 130, C.wine);
      text(ctx, it.t, { x: M, y: 200, w: W - M * 2, h: 930 }, { font: DISPLAY, max: 124, min: 66, color: C.wine, em: C.rose, lh: 1.1 });
      foot(ctx, C.wine);
    },
    // Blanco con franja vino: humor de vivir entre dos idiomas.
    latina(ctx, it) {
      bg(ctx, C.white);
      ctx.fillStyle = C.wine; ctx.fillRect(0, 0, W, 190);
      label(ctx, FORMATS.latina, M, 110, C.pink);
      text(ctx, it.t, { x: M, y: 250, w: W - M * 2, h: 880 }, { font: DISPLAY, max: 118, min: 62, color: C.wine, em: C.rose, lh: 1.12 });
      ctx.fillStyle = C.pink; ctx.fillRect(0, H - 150, W, 150);
      foot(ctx, C.wine);
    },
    // Título arriba, 3 a 5 puntos que invitan a guardar y compartir.
    lista(ctx, it) {
      bg(ctx, C.pink);
      label(ctx, FORMATS.lista, M, 130, C.wine);
      const items = it.items || [];
      const head = text(ctx, it.t, { x: M, y: 165, w: W - M * 2, h: 340 }, { font: DISPLAY, max: 96, min: 58, color: C.wine, em: C.rose, lh: 1.08, valign: 'top' });
      const top = head.bottom + 44, bottom = H - 130, cardH = bottom - top;
      ctx.fillStyle = C.white; rr(ctx, 56, top, W - 112, cardH, 28); ctx.fill();
      const rowH = (cardH - 40) / Math.max(items.length, 1);
      items.forEach((s, i) => {
        const y = top + 20 + rowH * i;
        ctx.fillStyle = C.wine; ctx.beginPath(); ctx.arc(120, y + rowH / 2, 12, 0, 7); ctx.fill();
        text(ctx, s, { x: 158, y: y + 6, w: W - 158 - 96, h: rowH - 12 }, { font: BODY, weight: 500, max: 54, min: 34, color: C.wine, lh: 1.18 });
      });
      foot(ctx, C.wine);
    },
    // Papel rayado: íntimo, parece escrito para quien lo lee.
    nota(ctx, it) {
      bg(ctx, C.wine);
      ctx.fillStyle = C.paper; rr(ctx, 62, 88, W - 124, H - 240, 30); ctx.fill();
      ctx.strokeStyle = 'rgba(79,15,27,.13)'; ctx.lineWidth = 2;
      for (let y = 300; y < H - 190; y += 88) { ctx.beginPath(); ctx.moveTo(62, y); ctx.lineTo(W - 62, y); ctx.stroke(); }
      label(ctx, FORMATS.nota, 118, 182, C.rose);
      text(ctx, it.t, { x: 118, y: 240, w: W - 236, h: 840 }, { font: BODY, weight: 500, max: 84, min: 46, color: C.wine, em: C.rose, lh: 1.24 });
      foot(ctx, C.pink);
    },
    // Conversación: escena familiar en burbujas propias; items = ['Mamá: ...', 'Yo: ...'].
    dialogo(ctx, it) {
      bg(ctx, C.pink);
      label(ctx, FORMATS.dialogo, M, 130, C.wine);
      text(ctx, it.t, { x: M, y: 160, w: W - M * 2, h: 190 }, { font: DISPLAY, max: 84, min: 54, color: C.wine, em: C.rose, lh: 1.06, valign: 'top' });
      const items = it.items || [], top = items.length < 2 ? 470 : 370, bottom = items.length < 2 ? 900 : H - 130, gap = 26;
      const h = (bottom - top - gap * (items.length - 1)) / Math.max(items.length, 1);
      items.forEach((raw, i) => {
        const m = String(raw).match(/^([^:]{1,14}):\s*(.*)$/), who = m ? m[1] : '', say = m ? m[2] : raw;
        const me = /^yo$/i.test(who.trim()), bw = W - 240, x = me ? W - 64 - bw : 64, y = top + (h + gap) * i;
        ctx.fillStyle = me ? C.wine : C.white; rr(ctx, x, y, bw, h, 34); ctx.fill();
        label(ctx, who, x + 36, y + 52, me ? C.pink : C.rose);
        text(ctx, say, { x: x + 36, y: y + 66, w: bw - 72, h: h - 90 }, { font: DISPLAY, max: items.length < 2 ? 88 : 62, min: 36, color: me ? C.white : C.wine, lh: 1.12 });
      });
      foot(ctx, C.wine);
    },
    // Permiso: solo texto centrado, sin etiqueta, para leer de un vistazo y enviar.
    permiso(ctx, it) {
      bg(ctx, C.pink);
      text(ctx, it.t, { x: M, y: 150, w: W - M * 2, h: 960 }, { font: DISPLAY, max: 112, min: 62, color: C.wine, em: C.rose, lh: 1.12, align: 'center' });
      ctx.font = `800 34px "${BODY}"`; ctx.fillStyle = C.wine; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(HANDLE, W / 2, H - 76);
    },
    // Dos mitades que obligan a elegir.
    pregunta(ctx, it) {
      const [a, b] = it.items && it.items.length > 1 ? it.items : ['Opción A', 'Opción B'];
      bg(ctx, C.white);
      ctx.fillStyle = C.wine; ctx.fillRect(0, 0, W, 470);
      label(ctx, FORMATS.pregunta, M, 120, C.pink);
      text(ctx, it.t, { x: M, y: 150, w: W - M * 2, h: 290 }, { font: DISPLAY, max: 86, min: 52, color: C.pink, em: C.white, lh: 1.08 });
      ctx.fillStyle = C.pink; ctx.fillRect(0, 470, W, 340);
      text(ctx, a, { x: M, y: 500, w: W - M * 2, h: 280 }, { font: DISPLAY, max: 84, min: 50, color: C.wine, lh: 1.08, align: 'center' });
      text(ctx, b, { x: M, y: 835, w: W - M * 2, h: 280 }, { font: DISPLAY, max: 84, min: 50, color: C.wine, lh: 1.08, align: 'center' });
      ctx.fillStyle = C.wine; ctx.beginPath(); ctx.arc(W / 2, 810, 58, 0, 7); ctx.fill();
      ctx.font = `800 40px "${BODY}"`; ctx.fillStyle = C.pink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('o', W / 2, 806);
      foot(ctx, C.wine);
    }
  };

  function drawCard(canvas, it) {
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    (T[it.f] || T.verdad)(ctx, it);
    return canvas;
  }

  root.GeriCards = { drawCard, FORMATS, W, H };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
const $=id=>document.getElementById(id), {drawCard,FORMATS}=GeriCards;
let pool=[...GERI_BANK], lot=[], sel=0, dl=null;
const say=s=>$('status').textContent=s;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
Object.entries(FORMATS).forEach(([k,v])=>$('fmt').add(new Option(v,k)));

// Reparte formatos para que el feed no se vea repetido.
function mix(){
  const n=+$('n').value, by={};
  shuffle(pool).forEach(p=>(by[p.f]=by[p.f]||[]).push(p));
  const out=[], keys=shuffle(Object.keys(by));
  while(out.length<n&&keys.some(k=>by[k].length)) for(const k of keys){ if(by[k].length&&out.length<n) out.push({...by[k].pop()}) }
  lot=out; sel=0; render();
}
function render(){
  const g=$('grid'); g.replaceChildren();
  lot.forEach((it,i)=>{
    const b=document.createElement('button'); b.className='tile'; b.setAttribute('aria-pressed',i===sel);
    const c=document.createElement('canvas'); drawCard(c,it);
    const s=document.createElement('small'); s.textContent=`${i+1}. ${FORMATS[it.f]}`;
    b.append(c,s); b.onclick=()=>{sel=i;render()}; g.append(b);
  });
  edit();
}
function preview(){ const it=lot[sel]; if(!it)return; const c=document.createElement('canvas'); drawCard(c,it); $('big').src=c.toDataURL('image/png'); const t=$('grid').children[sel]?.querySelector('canvas'); if(t)drawCard(t,it); }
function edit(){
  const it=lot[sel]; if(!it)return;
  $('fmt').value=it.f; $('txt').value=it.t; $('its').value=(it.items||[]).join('\n'); $('cap').value=it.c||'';
  $('itsL').hidden=!['lista','pregunta','dialogo'].includes(it.f); preview();
}
$('fmt').onchange=e=>{lot[sel].f=e.target.value; $('itsL').hidden=!['lista','pregunta','dialogo'].includes(e.target.value); render()};
$('txt').oninput=e=>{lot[sel].t=e.target.value;preview()};
$('its').oninput=e=>{lot[sel].items=e.target.value.split('\n').filter(s=>s.trim());preview()};
$('cap').oninput=e=>{lot[sel].c=e.target.value};
$('mix').onclick=mix; $('n').onchange=mix;
$('swap').onclick=()=>{const used=new Set(lot.map(x=>x.t));const o=shuffle(pool).find(p=>p.f===lot[sel].f&&!used.has(p.t));if(o){lot[sel]={...o};render()}else say('Ya no quedan frases distintas de este formato. Escribe una nueva o genera más.')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('cap').value);say('Pie de foto copiado.')}catch{$('cap').select();say('Selecciona el texto y cópialo a mano.')}};

const blob=it=>new Promise(r=>drawCard(document.createElement('canvas'),it).toBlob(r,'image/png'));
const slug=(it,i)=>`frase-${String(i+1).padStart(2,'0')}-${it.f}.png`;
async function save(filename,data){
  if(!dl){say('Esta vista no permite guardar archivos. Deja presionada la imagen para guardarla.');return}
  try{await dl.save({filename,data});say(`Listo: ${filename}.`)}
  catch(e){say(e.code==='declined'?'No se guardó el archivo.':'No se pudo guardar. Deja presionada la imagen o inténtalo de nuevo.')}
}
$('png').onclick=async()=>save(slug(lot[sel],sel),await blob(lot[sel]));
$('zip').onclick=async()=>{
  if(!window.JSZip){say('No cargó la función de ZIP. Guarda las imágenes una por una.');return}
  say('Preparando el ZIP…'); const z=new JSZip(); let caps='';
  for(let i=0;i<lot.length;i++){z.file(slug(lot[i],i),await blob(lot[i]));caps+=`${slug(lot[i],i)}\n${lot[i].c||''}\n\n`}
  z.file('pies-de-foto.txt',caps);
  save(`lote-frases-${new Date().toISOString().slice(0,10)}.zip`,await z.generateAsync({type:'blob'}));
};

// Frases nuevas con Claude: el botón solo aparece si esta vista lo permite.
async function genPhrases(sample){
  const tema=$('topic').value.trim()||'la vida de una mujer latina de 30 a 40 años en Estados Unidos';
  $('gen').disabled=true; say('Escribiendo frases…');
  const prompt=`Escribe 6 frases originales en español neutro latino para imágenes de Facebook. Tema: ${tema}.
Público: mujeres latinas de 28 a 45 años. Tono: directo, cálido, con humor cuando toque. Una por formato, en este orden: verdad, indirecta, latina, lista, nota, pregunta.
Reglas: la frase principal tiene máximo 16 palabras y resalta su remate entre *asteriscos*. "lista" trae un título corto en t y 4 puntos en items. "pregunta" trae dos opciones breves en items. Nada de pedir likes, "comenta amén", "comparte si", citas atribuidas a personas reales, consejos médicos ni café. No copies frases conocidas. Revisa ortografía y signos de apertura.
c es un pie de foto de máximo 10 palabras.
Responde solo con un arreglo JSON de objetos {"f","t","items","c"}.`;
  try{
    const r=await sample.json(prompt,{modelTier:'default'});
    const ok=(Array.isArray(r)?r:[]).filter(x=>x&&FORMATS[x.f]&&typeof x.t==='string');
    if(!ok.length) throw {};
    pool=[...ok,...pool]; lot=[...ok.slice(0,+$('n').value),...lot].slice(0,+$('n').value); sel=0; render();
    say(`Agregué ${ok.length} frases nuevas. Léelas antes de publicar.`);
  }catch(e){ say(e.code==='rate_limited'?'Demasiadas solicitudes seguidas. Espera un momento.':'No pude escribir frases esta vez. El banco sigue disponible.') }
  $('gen').disabled=false;
}

(async()=>{
  try{await Promise.all(['400 40px Gloock','500 40px Figtree','800 40px Figtree'].map(f=>document.fonts.load(f,'áñ¿')))}catch{}
  mix();
  if(window.claude?.use){
    dl=await claude.use('downloads');
    const sample=await claude.use('sample');
    if(sample){$('gen').hidden=false;$('gen').onclick=()=>genPhrases(sample)}
  }
})();
</script>
